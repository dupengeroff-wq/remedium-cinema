<!doctype html>

<meta charset="UTF-8">
<style id="stage6-critical">/* First paint is neutral even while styles/scripts are still arriving. */
html{color-scheme:dark;background:#060606}
.appearance-gate{display:none}
html[data-appearance-pending] #cinemaContent{visibility:hidden}
html[data-appearance-pending] .appearance-gate{position:fixed;inset:0;z-index:101;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f5f5f5;background:#060606;font:14px/1.4 system-ui,-apple-system,sans-serif;padding:18px 14px;text-align:center}
.appearance-gate strong{font-size:13px;letter-spacing:.16em}
.appearance-progress{width:min(260px,70vw);height:2px;background:#ffffff25;border-radius:4px;overflow:hidden}
.appearance-progress::before{content:"";display:block;width:38%;height:100%;background:#fff;border-radius:4px}
.appearance-slow,.appearance-retry{display:none}
html[data-boot-slow][data-appearance-pending] .appearance-slow{display:block}
html[data-boot-retry][data-appearance-pending] .appearance-retry{display:block}
.appearance-retry{font:inherit;color:inherit;background:transparent;border:1px solid #777;border-radius:11px;min-height:44px;padding:8px 14px}
</style>
<script id="stage6-bootstrap">/* Stage6: one early, credentialed, no-store identity read; no theme cache. */
(()=>{
 const root=document.documentElement;
 let slowTimer, retryTimer, armed=false;
 const ctrl=typeof AbortController==='function'?new AbortController():null;
 const deadline=setTimeout(()=>ctrl?.abort(),16000);
 let first=fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store',...(ctrl?{signal:ctrl.signal}:{})})
   .then(async response=>({ok:response.ok,status:response.status,data:await response.json().catch(()=>({}))}))
   .finally(()=>clearTimeout(deadline));
 first.catch(()=>{}); // the ordered client consumes the same rejection
 function arm(){
   if(armed)return;armed=true;
   slowTimer=setTimeout(()=>{if(root.hasAttribute('data-appearance-pending'))root.dataset.bootSlow='';},5000);
   retryTimer=setTimeout(()=>{if(root.hasAttribute('data-appearance-pending'))root.dataset.bootRetry='';},20000);
 }
 function finish(){clearTimeout(slowTimer);clearTimeout(retryTimer);armed=false;delete root.dataset.bootSlow;delete root.dataset.bootRetry;}
 window.CinemaBoot=Object.freeze({take(){const value=first;first=null;return value;},arm,finish});
 const visibility=()=>{if(document.hidden)root.dataset.pageHidden='';else delete root.dataset.pageHidden;};
 document.addEventListener('visibilitychange',visibility);visibility();
 arm();
})();</script>
