<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>REMEDIUM CINEMA</title>
<link rel="stylesheet" href="/social.css">
</head>
<body class="social-page">
<div id="cinemaContent">
<header class="social-top">
  <div class="social-brand-group">
    <button type="button" id="cinemaMenuToggle" class="cinema-menu-toggle" aria-label="Меню кинозала" aria-controls="cinemaMenu" aria-expanded="false" hidden>
      <span class="menu-dots" aria-hidden="true"></span><span id="cinemaMenuUnread" class="unread" hidden></span>
    </button>
    <a class="social-brand" href="/">✦ REMEDIUM CINEMA</a>
  </div>
  <nav id="socialNav" aria-label="Навигация"></nav>
</header>
<main id="socialMain" class="social-main" aria-live="polite"></main>
</div>
<button type="button" id="cinemaMenuScrim" class="cinema-menu-scrim" aria-label="Закрыть меню" hidden></button>
<aside id="cinemaMenu" class="cinema-menu" aria-labelledby="cinemaMenuTitle" hidden inert>
  <div class="cinema-menu-head">
    <h2 id="cinemaMenuTitle">Меню кинозала</h2>
    <button type="button" id="cinemaMenuClose" class="cinema-tool-close" aria-label="Закрыть меню">×</button>
  </div>
  <nav aria-label="Разделы кинозала"><ul class="cinema-menu-list"></ul></nav>
</aside>
<dialog id="socialDialog" class="social-dialog">
  <form method="dialog"><button type="submit" class="btn dialog-close" aria-label="Закрыть">×</button></form>
  <div id="socialDialogContent"></div>
</dialog>
<script src="/socket.io/socket.io.js"></script>
<script src="/account.js"></script>
<script src="/navigation.js"></script>
<script src="/social.js"></script>
</body>
</html>
